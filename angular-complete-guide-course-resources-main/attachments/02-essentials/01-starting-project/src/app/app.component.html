
<app-header></app-header>
<main>
  <ul id = "users">

    @for (user of DUMMY_USERS; track user.id) {
      <li>
        <app-user [user]="user" (selectedUser)="userSelected($event)"></app-user>
      </li>
    }
    
  </ul>


  @if (selectedUser) {
    <app-tasks [selectedUser]="getUser"></app-tasks>
  }@else {
    <p id = "fallback">Select the user to view their tasks</p>
  }
  
</main>
